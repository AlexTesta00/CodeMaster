services:
  rabbitmq:
    image: rabbitmq:4.2.2-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codemaster-net

  codemaster-user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - '4005:4005'
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-user:
        condition: service_started
    environment:
      - MONGO_URI=mongodb://mongo-user:27017/codemaster-user-db
      - PORT=4005
      - RABBITMQ_URL=amqp://guest:guest@host.docker.internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4005/api/v1/users/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - codemaster-net

  codemaster-authentication-service:
    build:
      context: ./authentication-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - '4004:4004'
    depends_on:
      mongo-authentication:
        condition: service_started
      rabbitmq:
        condition: service_healthy
